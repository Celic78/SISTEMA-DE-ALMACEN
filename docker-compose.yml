services:
  # Contenedor 1: Servidor Web PHP + Apache
  web:
    build:
      context: .
      dockerfile: Dockerfile.txt
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment: &app_database
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_DATABASE: sistema_almacen
      DB_USERNAME: app_user
      DB_PASSWORD: ${DB_DOCKER_PASSWORD:-app_password}

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.txt
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment: *app_database
    restart: unless-stopped

  # Contenedor 2: Base de Datos MariaDB
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: sistema_almacen
      MARIADB_USER: app_user
      MARIADB_PASSWORD: ${DB_DOCKER_PASSWORD:-app_password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
